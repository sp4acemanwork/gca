[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gca"
version = "0.1.0"
description = "Terminal algebra drill trainer tuned for combinatorics coursework"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
]

[project.scripts]
gca = "gca:main"

[tool.setuptools]
packages = ["gca", "gca.engine", "gca.engine.topics"]
